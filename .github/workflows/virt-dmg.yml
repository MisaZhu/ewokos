name: virt-dmg

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-virt-dmg:
    runs-on: macos-15   # Apple Silicon: hvf-accelerated aarch64 build & run
    timeout-minutes: 180

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install cross toolchain (aarch64-none-elf-gcc with newlib)
        run: |
          # Homebrew's aarch64-elf-gcc ships without newlib (breaks on
          # stdint.h), so use the xPack build of Arm's bare-metal toolchain.
          XPACK_VER=14.2.1-1.1
          curl -sL -o /tmp/xpack-gcc.tar.gz \
            "https://github.com/xpack-dev-tools/aarch64-none-elf-gcc-xpack/releases/download/v${XPACK_VER}/xpack-aarch64-none-elf-gcc-${XPACK_VER}-darwin-arm64.tar.gz"
          mkdir -p "$HOME/xpack" && tar xzf /tmp/xpack-gcc.tar.gz -C "$HOME/xpack"
          echo "$HOME/xpack/xpack-aarch64-none-elf-gcc-${XPACK_VER}/bin" >> "$GITHUB_PATH"
          "$HOME/xpack/xpack-aarch64-none-elf-gcc-${XPACK_VER}/bin/aarch64-none-elf-gcc" --version

      - name: Install tools
        run: |
          brew install e2fsprogs e2tools qemu
          # e2fsprogs (mke2fs) is keg-only; e2tools provides e2cp
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
          echo "$(brew --prefix e2tools)/bin" >> "$GITHUB_PATH"
          qemu-system-aarch64 --version
          mke2fs -V

      - name: Build kernel
        run: make -C machine.virt/kernel -j$(sysctl -n hw.ncpu)

      - name: Build rootfs
        run: make -C machine.virt/system

      - name: Create rootfs disk image
        run: make -C machine.virt/system sd

      - name: Package DMG
        run: |
          chmod +x tools/make_virt_dmg.sh
          tools/make_virt_dmg.sh EwokOS-virt-aarch64.dmg

      - name: Smoke test bundled qemu (from the DMG)
        run: |
          # mount the DMG and run the bundled, dependency-rewritten qemu from
          # it: it must start, boot the kernel for 20s without crashing or
          # exiting, and carry no references back to Homebrew paths.
          hdiutil attach -nobrowse -readonly EwokOS-virt-aarch64.dmg -mountpoint /Volumes/EwokOS
          APP=/Volumes/EwokOS/EwokOS-Virt.app
          QEMU="$APP/Contents/MacOS/qemu-system-aarch64"
          "$QEMU" --version
          codesign -v "$QEMU"
          # regressions that make the app silently fail to start:
          # - qemu must keep the hypervisor entitlement (needed for hvf)
          codesign -d --entitlements :- "$QEMU" 2>/dev/null | grep -q hypervisor \
            || { echo "bundled qemu lost its hypervisor entitlement"; exit 1; }
          # - the main executable must be a Mach-O, not a shell script
          file "$APP/Contents/MacOS/EwokOS-Virt" | grep -q Mach-O \
            || { echo "main executable is not a Mach-O"; exit 1; }
          if otool -L "$QEMU" | grep -q homebrew; then
            echo "bundled qemu still references homebrew libs"; otool -L "$QEMU"; exit 1
          fi
          cp "$APP/Contents/Resources/root_aarch64.img" /tmp/smoke-root.img
          smoke_boot() {
            ( sleep 20; pkill -x qemu-system-aarch64 ) &
            set +e
            "$QEMU" "$@" \
              -kernel "$APP/Contents/Resources/kernel8.img" \
              -drive file=/tmp/smoke-root.img,format=raw,id=blk0,if=none \
              -device virtio-blk-device,drive=blk0 \
              -netdev user,id=net0 -device virtio-net-device,netdev=net0 \
              > boot.log 2>&1
            RC=$?
            set -e
            wait || true
          }
          set -e
          # accel=hvf on a real Mac; hosted runners may lack nested
          # virtualization, so fall back to tcg if hvf is refused
          smoke_boot -M virt,highmem=on,accel=hvf -cpu host -m 8192 -serial mon:stdio -nographic || true
          if [ "$RC" != "143" ] && grep -q "Could not access HVF" boot.log; then
            echo "hvf unavailable on runner, retrying with tcg"
            smoke_boot -M virt,highmem=on,accel=tcg -cpu cortex-a72 -m 1024 -serial mon:stdio -nographic || true
          fi
          # 143 = terminated by pkill: qemu survived the whole window
          if [ "$RC" = "143" ] || grep -q "terminating on signal" boot.log; then
            echo "bundled qemu smoke test OK"
          else
            echo "qemu exited early:"; cat boot.log; exit 1
          fi
          sleep 2
          hdiutil detach /Volumes/EwokOS -force || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EwokOS-virt-aarch64-dmg
          path: EwokOS-virt-aarch64.dmg
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EwokOS-virt-aarch64.dmg

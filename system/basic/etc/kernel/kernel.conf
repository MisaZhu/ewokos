# sys_dma is a DMA-reachable physical RANGE, not a reserved pool: normal
# memory allocation shares these pages; dma_alloc must land inside the range.
# dma_base = range start (phys addr, dec or 0x hex), dma_size = range extent
# (K/M/G units). Both optional: omitted/0 = the BSP hardware range; a set
# value only NARROWS that range (intersected, never widened).
